name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_os: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_os: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libxkbcommon-dev libfontconfig-dev

      - name: Build mdpeek
        run: cargo build --release -p mdpeek --target ${{ matrix.target }}

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Download NSIS updater plugin
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p packaging/windows/plugins
          curl -L -o packaging/windows/plugins/nsis_tauri_utils.dll \
            https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll
          echo "5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709  packaging/windows/plugins/nsis_tauri_utils.dll" | sha256sum -c -

      - name: Package Windows binary and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          New-Item -ItemType Directory -Force nsis-build/plugins | Out-Null
          Compress-Archive "target/${{ matrix.target }}/release/mdpeek.exe" "artifacts/mdpeek-$version-${{ matrix.asset_os }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/mdpeek.exe" "nsis-build/mdpeek.exe"
          Copy-Item "packaging/windows/icon.ico" "nsis-build/icon.ico"
          Copy-Item "packaging/windows/mdpeek.nsi" "nsis-build/mdpeek.nsi"
          Copy-Item "packaging/windows/plugins/nsis_tauri_utils.dll" "nsis-build/plugins/nsis_tauri_utils.dll"
          Push-Location nsis-build
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          & $makensis "-DVERSION=$version" "-DOUTFILE=mdpeek-$version-setup.exe" "mdpeek.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Pop-Location
          Copy-Item "nsis-build/mdpeek-$version-setup.exe" "artifacts/mdpeek-$version-setup.exe"

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $installer = Resolve-Path "artifacts/mdpeek-$version-setup.exe"
          $program = "C:\Program Files\mdpeek\mdpeek.exe"
          $uninstaller = "C:\Program Files\mdpeek\uninstall.exe"
          $install = Start-Process $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exited with $($install.ExitCode)" }
          if (-not (Test-Path $program)) { throw "installer did not install mdpeek.exe" }
          if (-not (Test-Path $uninstaller)) { throw "installer did not install uninstall.exe" }
          $uninstall = Start-Process $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exited with $($uninstall.ExitCode)" }
          if (Test-Path $program) { throw "uninstaller left mdpeek.exe behind" }

      - name: Sign Windows updater installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          npx --yes @tauri-apps/cli@2.12.6 signer sign --app-version "$VERSION" "artifacts/mdpeek-$VERSION-setup.exe"

      - name: Build Windows updater manifest
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          node scripts/make-updater-manifest.mjs \
            "$VERSION" \
            "artifacts/mdpeek-$VERSION-setup.exe.sig" \
            "mdpeek-$VERSION-setup.exe" \
            artifacts/latest.json
          rm "artifacts/mdpeek-$VERSION-setup.exe.sig"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C "target/${{ matrix.target }}/release" -czf "artifacts/mdpeek-${{ steps.ver.outputs.version }}-${{ matrix.asset_os }}.tar.gz" mdpeek

      - name: Extract release notes
        shell: bash
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          awk -v tag="$VERSION" 'index($0, "## [" tag "]") == 1 { f = 1; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "mdpeek v$VERSION. See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" artifacts/* \
              --title "mdpeek v$VERSION" \
              --notes-file release-notes.md
          gh release upload "v$VERSION" artifacts/* --clobber
