name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_os: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libxkbcommon-dev

      - name: Build mdpeek
        run: cargo build --release -p mdpeek --target ${{ matrix.target }}

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive "target/${{ matrix.target }}/release/mdpeek.exe" "artifacts/mdpeek-${{ steps.ver.outputs.version }}-${{ matrix.asset_os }}.zip"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C "target/${{ matrix.target }}/release" -czf "artifacts/mdpeek-${{ steps.ver.outputs.version }}-${{ matrix.asset_os }}.tar.gz" mdpeek

      - name: Extract release notes
        shell: bash
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          awk -v tag="$VERSION" 'index($0, "## [" tag "]") == 1 { f = 1; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "mdpeek v$VERSION. See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" artifacts/* \
              --title "mdpeek v$VERSION" \
              --notes-file release-notes.md
          gh release upload "v$VERSION" artifacts/* --clobber
